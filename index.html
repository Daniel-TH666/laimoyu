<!DOCTYPE html>
<html lang="en" data-lang="en">
<!--
  这个文件不参与最终页面内容 —— 它只做两件事：
    1) 让 Vite 知道要打包 src/main.js（下面的 script 标签）
    2) 提供一次 HTML 处理流程，供 build/prerender.js 在 generateBundle 阶段接手

  ★ 真正的首页 HTML 全部由 build/prerender.js + build/home-template.js 在构建期生成，
    每种语言一份（/ 、/zh/ 等），所以改首页结构请去 build/home-template.js，
    改区块样式请去 src/lib/render.js，不要改这个文件。
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moyu Paradise</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script type="module" src="/src/main.js"></script>
</head>
<body class="text-ink-800 font-sans antialiased">
  <noscript>This site needs JavaScript for search and filtering. The full list of sites is in the page source.</noscript>
